<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Cases – CaseFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background: #f0f4f8; }
    .navbar { background: linear-gradient(135deg, #1e3c72, #2a5298); }
    .cases-card { background: #fff; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.07); overflow: hidden; }
    .btn-view { background: linear-gradient(135deg, #1e3c72, #2a5298); color: #fff; border: none; font-size: .85rem; }
    .btn-view:hover { opacity: .9; color: #fff; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold fs-4">⚖️ CaseFlow</span>
    <div class="d-flex align-items-center gap-3">
      <span class="text-white small" id="welcomeMsg"></span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
  </nav>

  <div class="container py-4">
    <h4 class="fw-bold mb-4">My Assigned Cases</h4>
    <div class="cases-card">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Case Title</th>
            <th>Lawyer</th>
            <th>Status</th>
            <th>Created</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="casesBody">
          <tr><td colspan="5" class="text-center text-muted py-4">Loading your cases...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/app.js"></script>
  <script>
    if (!requireAuth('client')) throw new Error('Not authorized');
    document.getElementById('welcomeMsg').textContent = 'Welcome, ' + getUser().name;

    async function loadCases() {
      const res = await fetch('/api/cases', { headers: authHeaders() });
      const cases = await res.json();
      const tbody = document.getElementById('casesBody');
      if (!cases.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No cases assigned to you yet.</td></tr>';
        return;
      }
      tbody.innerHTML = cases.map(c => `
        <tr>
          <td class="fw-semibold">${c.title}</td>
          <td>${c.lawyerId ? c.lawyerId.name : '—'}</td>
          <td>${statusBadge(c.status)}</td>
          <td>${new Date(c.createdAt).toLocaleDateString()}</td>
          <td><a href="/pages/client-case-view.html?id=${c._id}" class="btn btn-view btn-sm"><i class="bi bi-eye me-1"></i>View</a></td>
        </tr>
      `).join('');
    }

    loadCases();
  </script>
</body>
</html>
