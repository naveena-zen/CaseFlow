<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Detail – CaseFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background: #f0f4f8; }
    .navbar { background: linear-gradient(135deg, #1e3c72, #2a5298); }
    .section-card { background: #fff; border: none; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.07); padding: 1.5rem; margin-bottom: 1.5rem; }
    .section-title { font-weight: 700; font-size: 1.1rem; border-left: 4px solid #2a5298; padding-left: 10px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark px-4 py-3">
    <a href="/pages/lawyer-dashboard.html" class="navbar-brand fw-bold fs-5"><i class="bi bi-arrow-left me-2"></i>⚖️ CaseFlow</a>
    <button class="btn btn-outline-light btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
  </nav>

  <div class="container py-4">
    <!-- Case Info -->
    <div class="section-card">
      <div class="section-title">Case Information</div>
      <div id="caseInfo"><div class="text-muted">Loading...</div></div>
    </div>

    <!-- Documents -->
    <div class="section-card">
      <div class="section-title">Documents</div>
      <div class="d-flex gap-2 mb-3">
        <input type="file" id="fileInput" class="form-control" />
        <button class="btn btn-primary px-4" onclick="uploadDoc()"><i class="bi bi-upload me-1"></i>Upload</button>
      </div>
      <ul class="list-group" id="docsList"><li class="list-group-item text-muted">Loading...</li></ul>
    </div>

    <!-- Deadlines -->
    <div class="section-card">
      <div class="section-title">Deadlines</div>
      <div class="row g-2 mb-3">
        <div class="col-md-5">
          <input type="text" id="deadlineTitle" class="form-control" placeholder="Deadline title" />
        </div>
        <div class="col-md-4">
          <input type="date" id="deadlineDate" class="form-control" />
        </div>
        <div class="col-md-3">
          <button class="btn btn-primary w-100" onclick="addDeadline()"><i class="bi bi-calendar-plus me-1"></i>Add</button>
        </div>
      </div>
      <ul class="list-group" id="deadlinesList"><li class="list-group-item text-muted">Loading...</li></ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/app.js"></script>
  <script>
    if (!requireAuth('lawyer')) throw new Error('Not authorized');

    const params = new URLSearchParams(window.location.search);
    const caseId = params.get('id');
    if (!caseId) { alert('No case ID specified'); window.location.href = '/pages/lawyer-dashboard.html'; }

    async function loadCase() {
      const res = await fetch(`/api/cases/${caseId}`, { headers: authHeaders() });
      const c = await res.json();
      document.getElementById('caseInfo').innerHTML = `
        <div class="row">
          <div class="col-md-8">
            <h5 class="fw-bold">${c.title}</h5>
            <p class="text-muted">${c.description || '—'}</p>
            <p><strong>Client:</strong> ${c.clientId ? c.clientId.name + ' (' + c.clientId.email + ')' : '—'}</p>
            <p><strong>Created:</strong> ${new Date(c.createdAt).toLocaleDateString()}</p>
          </div>
          <div class="col-md-4 text-md-end">
            <p class="mb-1"><strong>Status</strong></p>
            <select id="statusSelect" class="form-select" style="max-width:160px;display:inline-block;" onchange="updateStatus(this.value)">
              <option value="Open" ${c.status==='Open'?'selected':''}>Open</option>
              <option value="Active" ${c.status==='Active'?'selected':''}>Active</option>
              <option value="Closed" ${c.status==='Closed'?'selected':''}>Closed</option>
            </select>
            <div class="mt-2">${statusBadge(c.status)}</div>
          </div>
        </div>
      `;
    }

    async function updateStatus(status) {
      const res = await fetch(`/api/cases/${caseId}/status`, {
        method: 'PATCH', headers: authHeaders(), body: JSON.stringify({ status })
      });
      if (!res.ok) { const d = await res.json(); return alert(d.message || 'Update failed'); }
      const badge = document.querySelector('#caseInfo .badge') || document.querySelector('#caseInfo');
      loadCase();
    }

    async function loadDocs() {
      const res = await fetch(`/api/documents/${caseId}`, { headers: authHeaders() });
      const docs = await res.json();
      const list = document.getElementById('docsList');
      if (!docs.length) { list.innerHTML = '<li class="list-group-item text-muted">No documents uploaded yet.</li>'; return; }
      list.innerHTML = docs.map(d => `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <span><i class="bi bi-file-earmark me-2 text-primary"></i>${d.originalName}</span>
          <a href="/api/documents/download/${d._id}" class="btn btn-outline-primary btn-sm" target="_blank"><i class="bi bi-download me-1"></i>Download</a>
        </li>
      `).join('');
    }

    async function uploadDoc() {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files.length) return alert('Please select a file first.');
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      const res = await fetch(`/api/documents/upload/${caseId}`, {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + getToken() },
        body: formData
      });
      const data = await res.json();
      if (!res.ok) return alert(data.message || 'Upload failed');
      fileInput.value = '';
      loadDocs();
    }

    async function loadDeadlines() {
      const res = await fetch(`/api/deadlines/${caseId}`, { headers: authHeaders() });
      const deadlines = await res.json();
      const list = document.getElementById('deadlinesList');
      if (!deadlines.length) { list.innerHTML = '<li class="list-group-item text-muted">No deadlines set yet.</li>'; return; }
      list.innerHTML = deadlines.map(d => `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <span><i class="bi bi-calendar-event me-2 text-warning"></i>${d.title}</span>
          <span class="badge bg-light text-dark border">📅 ${new Date(d.dueDate).toLocaleDateString()}</span>
        </li>
      `).join('');
    }

    async function addDeadline() {
      const title = document.getElementById('deadlineTitle').value.trim();
      const dueDate = document.getElementById('deadlineDate').value;
      if (!title || !dueDate) return alert('Please fill in both the title and due date.');
      const res = await fetch(`/api/deadlines/${caseId}`, {
        method: 'POST', headers: authHeaders(), body: JSON.stringify({ title, dueDate })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.message || 'Failed to add deadline');
      document.getElementById('deadlineTitle').value = '';
      document.getElementById('deadlineDate').value = '';
      loadDeadlines();
    }

    loadCase();
    loadDocs();
    loadDeadlines();
  </script>
</body>
</html>
