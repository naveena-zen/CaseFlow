<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – CaseFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; }
    .card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .brand { font-size: 2rem; font-weight: 800; color: #1e3c72; letter-spacing: -1px; }
    .btn-success { background: linear-gradient(135deg, #11998e, #38ef7d); border: none; color: #fff; }
    .btn-success:hover { opacity: 0.9; color: #fff; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
  <div class="card p-5" style="width: 100%; max-width: 420px;">
    <div class="text-center mb-4">
      <div class="brand">⚖️ CaseFlow</div>
      <p class="text-muted">Create a new account</p>
    </div>
    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Full Name</label>
        <input type="text" id="name" class="form-control form-control-lg" placeholder="Jane Doe" required />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" id="email" class="form-control form-control-lg" placeholder="you@example.com" required />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" id="password" class="form-control form-control-lg" placeholder="••••••••" required />
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Role</label>
        <select id="role" class="form-select form-select-lg" required>
          <option value="">Select role...</option>
          <option value="lawyer">Lawyer</option>
          <option value="client">Client</option>
        </select>
      </div>
      <button type="submit" class="btn btn-success btn-lg w-100">Create Account</button>
    </form>
    <p class="text-center mt-3 mb-0 text-muted small">
      Already have an account? <a href="/pages/login.html">Login</a>
    </p>
  </div>

  <script src="/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });
        const data = await res.json();
        if (!res.ok) return alert(data.message || 'Registration failed');
        alert('Account created! Please login.');
        window.location.href = '/pages/login.html';
      } catch (err) {
        alert('Server error. Please try again.');
      }
    });
  </script>
</body>
</html>
