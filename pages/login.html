<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – CaseFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; }
    .card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .brand { font-size: 2rem; font-weight: 800; color: #1e3c72; letter-spacing: -1px; }
    .btn-primary { background: linear-gradient(135deg, #1e3c72, #2a5298); border: none; }
    .btn-primary:hover { opacity: 0.9; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
  <div class="card p-5" style="width: 100%; max-width: 420px;">
    <div class="text-center mb-4">
      <div class="brand">⚖️ CaseFlow</div>
      <p class="text-muted">Sign in to your account</p>
    </div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" id="email" class="form-control form-control-lg" placeholder="you@example.com" required />
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" id="password" class="form-control form-control-lg" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
    </form>
    <p class="text-center mt-3 mb-0 text-muted small">
      No account? <a href="/pages/register.html">Register</a>
    </p>
    <hr class="my-3" />
    <div class="text-center text-muted small">
      <strong>Demo credentials:</strong><br />
      Lawyer: lawyer@lex.com / pass123<br />
      Client: client@lex.com / pass123
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    // Redirect if already logged in
    const u = getUser();
    if (u) window.location.href = u.role === 'lawyer' ? '/pages/lawyer-dashboard.html' : '/pages/client-dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) return alert(data.message || 'Login failed');
        localStorage.setItem('CaseFlow_token', data.token);
        localStorage.setItem('CaseFlow_user', JSON.stringify(data.user));
        window.location.href = data.user.role === 'lawyer' ? '/pages/lawyer-dashboard.html' : '/pages/client-dashboard.html';
      } catch (err) {
        alert('Server error. Please try again.');
      }
    });
  </script>
</body>
</html>
