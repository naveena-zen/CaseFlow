<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – CaseFlow</title>
  <meta name="description" content="Sign in to CaseFlow, the secure legal case management platform for lawyers and clients." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f2044 0%, #1e3c72 50%, #2a5298 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .login-card {
      background: #fff; border-radius: 20px;
      box-shadow: 0 32px 80px rgba(0,0,0,.28); padding: 2.5rem 2.25rem;
      width: 100%; max-width: 440px; animation: fadeUp .45s ease;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }
    .brand-logo { font-size: 2.1rem; font-weight: 800; color: #1e3c72; letter-spacing: -1.5px; }
    .brand-sub { font-size: .875rem; color: #6c757d; margin-top: .25rem; }
    .form-control, .form-select {
      border-radius: 10px; border: 1.5px solid #dee2e6; padding: .75rem 1rem;
      font-size: .95rem; transition: border-color .2s, box-shadow .2s;
    }
    .form-control:focus { border-color: #2a5298; box-shadow: 0 0 0 3px rgba(42,82,152,.15); outline: none; }
    .btn-login {
      background: linear-gradient(135deg, #1e3c72, #2a5298); border: none;
      border-radius: 10px; color: #fff; font-weight: 600; padding: .8rem;
      font-size: .95rem; width: 100%; transition: opacity .2s, transform .15s;
    }
    .btn-login:hover { opacity: .92; transform: translateY(-1px); color: #fff; }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: .65; cursor: not-allowed; }
    .demo-box {
      background: #f8f9fc; border-radius: 10px; padding: .85rem 1rem;
      border: 1px solid #e9ecef; font-size: .8rem;
    }
    .field-group { position: relative; margin-bottom: 1rem; }
    .pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #6c757d; padding: 0;
      font-size: 1.1rem; z-index: 2;
    }
    .spinner-border-sm { width: 1rem; height: 1rem; border-width: .15em; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="brand-logo">⚖️ CaseFlow</div>
      <div class="brand-sub">Secure Legal Case Management</div>
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold small">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="mb-4 field-group">
        <label for="password" class="form-label fw-semibold small">Password</label>
        <input type="password" id="password" class="form-control pe-5" placeholder="••••••••" autocomplete="current-password" />
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password visibility">👁</button>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
    </form>

    <p class="text-center mt-3 mb-3 text-muted small">
      Don't have an account? <a href="/pages/register.html" class="fw-semibold text-decoration-none" style="color:#2a5298">Register</a>
    </p>

    <div class="demo-box">
      <div class="fw-semibold mb-1">🔑 Demo Credentials</div>
      <div><span class="text-muted">Lawyer:</span> <code>lawyer@caseflow.dev</code> / <code>password123</code></div>
      <div><span class="text-muted">Client:</span> <code>client@caseflow.dev</code> / <code>password123</code></div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    // Redirect if already logged in
    const u = getUser();
    if (u) window.location.href = u.role === 'lawyer' ? '/pages/lawyer-dashboard.html' : '/pages/client-dashboard.html';

    // Password toggle
    document.getElementById('pwToggle').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearFieldErrors();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in…';

      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          if (data.error?.details) showFieldErrors(data.error.details);
          else showToast(data.error?.message || 'Login failed. Please check your credentials.', 'error');
          btn.disabled = false; btn.innerHTML = 'Sign In';
          return;
        }

        localStorage.setItem('CaseFlow_token', data.token);
        localStorage.setItem('CaseFlow_user', JSON.stringify(data.user));
        showToast(`Welcome back, ${data.user.name}! ✨`, 'success');
        setTimeout(() => {
          window.location.href = data.user.role === 'lawyer'
            ? '/pages/lawyer-dashboard.html' : '/pages/client-dashboard.html';
        }, 900);
      } catch (err) {
        showToast('Server error. Please try again.', 'error');
        btn.disabled = false; btn.innerHTML = 'Sign In';
      }
    });
  </script>
</body>
</html>
